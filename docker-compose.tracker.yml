# ForeverTracker (buildthehomelab/wow-forever-tracker, a fork of filinodz/ForeverTracker, MIT): a website that compares
# the official Forever client's content with this server (dungeons, bosses, quests, items, spells, mounts... what
# players can and cannot get, and why), a changelog of every client build, and the Forge, which turns what is missing
# into SQL with a rollback. docs/forever-tracker.md.
#
# A TrueNAS custom app of its own beside the "everlake" app, from the same folder, like the PTR:
#   include:
#     - <everlake folder>/docker-compose.tracker.yml
# It reads this folder's .env (MYSQL_ROOT_PASSWORD, TRACKER_DB_PASSWORD, TRACKER_ADMIN_PASSWORD, DATA_DIR).
#   - tracker-init gives the MySQL user "tracker" its rights (scripts/tracker-setup.sh): read only on the live
#     world, hotfixes and auth; read and write on the PTR's world_ptr and hotfixes_ptr, where the Forge applies fixes.
#     With TRACKER_BUILD_DB_PASSWORD it also makes the world build's user "tracker_build": every right on the scratch
#     database ft_world_build, no right anywhere else ("tracker" may read that database, never write it)
#   - tracker-world-copy and tracker-world-sort put the files the realm's image was built from (release dump, core
#     update files, world data) in the tracker-world volume, for "tracker.py world replay" (docs/forever-tracker.md)
#   - tracker is the website; on its first start (and on a new client build) it stores the build's DB2 files from
#     DATA_DIR/dbc, analyses, and runs the locator, in the background (a few minutes; the app's log shows it)
services:
  tracker-init:
    image: mysql:8.0
    networks: [everlake]
    restart: "no"
    entrypoint: ["bash", "/scripts/tracker-setup.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TRACKER_DB_PASSWORD: ${TRACKER_DB_PASSWORD:?set TRACKER_DB_PASSWORD in .env}
      TRACKER_WORLD_DB: ${TRACKER_WORLD_DB:-world_ptr}
      TRACKER_HOTFIXES_DB: ${TRACKER_HOTFIXES_DB:-hotfixes_ptr}
      TRACKER_BUILD_DB: ${TRACKER_BUILD_DB:-ft_world_build}
      TRACKER_BUILD_DB_PASSWORD: ${TRACKER_BUILD_DB_PASSWORD:-}
    volumes:
      - ./scripts/tracker-setup.sh:/scripts/tracker-setup.sh:ro

  # The world build's inputs (docs/forever-tracker.md, "The world build"), on every start of the app. The first runs
  # inside the realm's own image and copies what that image was built from: the release dump its worldserver imports
  # and its sql/updates/world and sql/custom/world. Nothing is downloaded again, so the replay reads exactly the files
  # the realm runs. The image is the live realm's (EVERLAKE_IMAGE_TAG, or live); TRACKER_WORLD_IMAGE_TAG picks
  # another, for example the PTR's ptr-<core>-<world data>. It must exist on this server, with or without a world
  # build: the app does not start without it.
  tracker-world-copy:
    image: everlake-trinitycore:${TRACKER_WORLD_IMAGE_TAG:-${EVERLAKE_IMAGE_TAG:-live}}
    pull_policy: never   # a local image: built by the PTR app, made live by scripts/promote.sh
    network_mode: none
    restart: "no"
    entrypoint: ["bash", "/scripts/tracker-world-files.sh"]
    volumes:
      - ./scripts/tracker-world-files.sh:/scripts/tracker-world-files.sh:ro
      - tracker-world:/world

  # The second tells the image's custom files apart: the world-data files (their names from the data repository at
  # the image's WORLD_DATA_COMMIT, each compared with the image's copy), this repository's own (the Dockerfile's
  # COPY lines), and the core's. Then it puts the set in place as /world/current. The first step removes the set of
  # the start before, so a problem in either leaves none (and is said in the log); neither stops the website.
  tracker-world-sort:
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      tracker-world-copy:
        condition: service_completed_successfully
    command: ["python", "-I", "/scripts/tracker-world-sort.py"]
    environment:
      WORLD_IMAGE: everlake-trinitycore:${TRACKER_WORLD_IMAGE_TAG:-${EVERLAKE_IMAGE_TAG:-live}}
    volumes:
      - ./scripts/tracker-world-sort.py:/scripts/tracker-world-sort.py:ro
      - ./Dockerfile:/everlake/Dockerfile:ro
      - tracker-world:/world

  tracker:
    build:
      # the fork at a pinned commit (bump on purpose, like the core)
      context: https://github.com/buildthehomelab/wow-forever-tracker.git#${TRACKER_COMMIT:-dfac085247419f75e46909d85e8ef6d38b53ed6e}
      # kept in the image and shown in the website's footer after the version: which commit is running can be read
      # off the page
      args:
        FT_COMMIT: ${TRACKER_COMMIT:-dfac085247419f75e46909d85e8ef6d38b53ed6e}
    image: forever-tracker:${TRACKER_COMMIT:-dfac085247419f75e46909d85e8ef6d38b53ed6e}
    networks: [everlake]
    restart: unless-stopped
    depends_on:
      tracker-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
      FT_DB_HOST: mysql
      FT_DB_USER: tracker
      FT_DB_PASSWORD: ${TRACKER_DB_PASSWORD:?set TRACKER_DB_PASSWORD in .env}
      FT_DB_TRACKER: forever_tracker
      # what the analysis reads and the Forge writes: the PTR's copies by default. TRACKER_WORLD_DB=world and
      # TRACKER_HOTFIXES_DB=hotfixes: a report of live itself, where the Forge can only preview (read only)
      FT_DB_WORLD: ${TRACKER_WORLD_DB:-world_ptr}
      FT_DB_HOTFIXES: ${TRACKER_HOTFIXES_DB:-hotfixes_ptr}
      FT_DB_AUTH: auth
      # the world build's own account and scratch database (tracker-init makes the user when the password is set;
      # without it there is no build user, and the replay refuses the tracker's normal account)
      FT_BUILD_DB: ${TRACKER_BUILD_DB:-ft_world_build}
      FT_BUILD_USER: ${TRACKER_BUILD_DB_PASSWORD:+tracker_build}
      FT_BUILD_PASSWORD: ${TRACKER_BUILD_DB_PASSWORD:-}
      FT_ADMIN_USER: ${TRACKER_ADMIN_USER:-admin}
      FT_ADMIN_PASSWORD: ${TRACKER_ADMIN_PASSWORD:-}
      FT_SITE_NAME: ${TRACKER_SITE_NAME:-Everlake Tracker}
      FT_LANGUAGES: en   # English only: no French names (the upstream tool is French first) and no language switch
      FT_PUBLIC: ${TRACKER_PUBLIC:-0}
      FT_LOCATE: ${TRACKER_LOCATE:-1}
      # Season of Discovery rune abilities the Forever client still carries: never offered at trainers
      FT_FORGE_TRAINER_SKIP_IDS: ${TRACKER_TRAINER_SKIP_IDS:-400000-499999}
      # trainer spells come from imports (NorgannonDB) only: no guessing from the client's skill lines
      FT_FORGE_TRAINER_GUESS: ${TRACKER_TRAINER_GUESS:-0}
      # AtlasLoot Classic Forever: CurseForge checked every N hours, a new version becomes an import card (0 = never);
      # TRACKER_ATLASLOOT_GUESS=0 leaves out its drops that have no measured chance instead of an even share
      FT_ATLASLOOT_EVERY_HOURS: ${TRACKER_ATLASLOOT_EVERY_HOURS:-6}
      FT_ATLASLOOT_GUESS: ${TRACKER_ATLASLOOT_GUESS:-1}
      # release phases: empty = each phase opens on Forever's date (first raids 2026-12-09); a phase key, a number,
      # all or none to run ahead of or behind it (read at each page load, no new analysis)
      FT_PHASE: ${TRACKER_PHASE:-}
      # the official client from Blizzard's own servers: every N hours the live build is looked up and, when it is
      # newer than the newest one stored (or a key of its hidden content was published), read from the CDN and
      # analysed (0 = never). Needs the internet: us.patch.battle.net:1119 and Blizzard's CDN hosts
      FT_CLIENT_EVERY_HOURS: ${TRACKER_CLIENT_EVERY_HOURS:-6}
    ports:
      - "${TRACKER_PORT:-8090}:80"
    volumes:
      - ${DATA_DIR:-./data}:/server/data:ro
      - tracker-data:/opt/forever-tracker/data
      - tracker-world:/world:ro   # the replay's inputs, /world/current (tracker-world-copy, tracker-world-sort)

networks:
  everlake:
    name: ${EVERLAKE_NETWORK:-ix-everlake_everlake}
    external: true

volumes:
  tracker-data:
  tracker-world:
