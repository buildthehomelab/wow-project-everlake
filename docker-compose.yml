name: everlake

x-trinity-env: &trinity-env
  TZ: ${TZ:-UTC}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: ${DB_USER:-trinity}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  WORLD_PORT: ${WORLD_PORT:-8085}   # realm 1's port: worldserver listens on it, bnetserver writes it to the realm list

services:
  mysql:
    image: mysql:8.0
    networks: [everlake]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      DB_USER: ${DB_USER:-trinity}
      DB_PASSWORD: ${DB_PASSWORD}
    command:
      - --max-allowed-packet=1G
      - --skip-log-bin
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    # MySQL is only reachable from the other containers. Uncomment for a local admin tool (never expose it publicly).
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worldserver:
    build:
      context: .
      args:
        TC_COMMIT: ${TC_COMMIT:-d4fcfa58b71be15b9949634b5721e862a299df6b}
        BUILD_JOBS: ${BUILD_JOBS:-4}
        WORLD_DATA_COMMIT: ${WORLD_DATA_COMMIT:-}
    image: everlake-trinitycore:${EVERLAKE_IMAGE_TAG:-latest}
    command: ["worldserver"]
    networks: [everlake]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *trinity-env
      MMAP_PATHFINDING: ${MMAP_PATHFINDING:-0}
      CLIENT_BUILD: ${CLIENT_BUILD:-}
      PACKET_LOG: ${PACKET_LOG:-0}   # 1 = packet log (diagnostics, holds chat)
    # interactive console: docker compose attach worldserver  (leave with Ctrl+P, Ctrl+Q)
    stdin_open: true
    tty: true
    stop_grace_period: 2m
    ports:
      - "${WORLD_PORT:-8085}:${WORLD_PORT:-8085}"
    volumes:
      - ${DATA_DIR:-./data}:/opt/trinitycore/data:ro
      - ./overrides:/opt/trinitycore/overrides:ro
      - logs:/opt/trinitycore/logs

  bnetserver:
    image: everlake-trinitycore:${EVERLAKE_IMAGE_TAG:-latest}
    pull_policy: never   # local image, built by the worldserver service
    command: ["bnetserver"]
    networks: [everlake]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      worldserver:
        condition: service_started
    environment:
      <<: *trinity-env
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-127.0.0.1}
      REALM_LOCAL_ADDRESS: ${REALM_LOCAL_ADDRESS:-127.0.0.1}
      REALM_LOCAL_SUBNET_MASK: ${REALM_LOCAL_SUBNET_MASK:-255.255.255.0}
      REALM_NAME: ${REALM_NAME:-Everlake}
      LOGIN_HOSTNAME: ${LOGIN_HOSTNAME:-trinity.actual.battle.net}
      CERT_FILE: ${CERT_FILE:-forever.cert.pem}
      KEY_FILE: ${KEY_FILE:-forever.key.pem}
      AUTH_UPDATES_WAIT: ${AUTH_UPDATES_WAIT:-600}   # seconds to wait for worldserver's auth updates (build list)
    # bnetserver refuses to start if it cannot resolve the LoginREST hostname itself. It only checks that the name
    # resolves (it hands players the name, not an address), so inside the container it may point at itself.
    extra_hosts:
      - "${LOGIN_HOSTNAME:-trinity.actual.battle.net}:127.0.0.1"
    ports:
      - "1119:1119"
      - "8081:8081"
    volumes:
      - ${CERTS_DIR:-./certs}:/opt/trinitycore/certs:ro
      - ./overrides:/opt/trinitycore/overrides:ro
      - logs:/opt/trinitycore/logs

  # Game data extraction (Blizzard CDN by default, see docker/extract.sh): docker compose run --rm extractor
  extractor:
    image: everlake-trinitycore:${EVERLAKE_IMAGE_TAG:-latest}
    pull_policy: never   # local image: run "docker compose build" first
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/extract.sh"]
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      CASC_REMOTE: ${CASC_REMOTE:-1}
      CASC_PRODUCT: ${CASC_PRODUCT:-wowf}
      CASC_REGION: ${CASC_REGION:-us}
      EXTRACT_MMAPS: ${EXTRACT_MMAPS:-0}
      DBC_ONLY: ${DBC_ONLY:-0}
      MMAPS_ONLY: ${MMAPS_ONLY:-0}
      SKIP_MAPS: ${SKIP_MAPS:-0}
    volumes:
      - "${WOW_DIR:-./wow-not-set}:/wow:ro"
      - ${DATA_DIR:-./data}:/opt/trinitycore/data
      - casc-cache:/cache
      # the repo's script, so changes apply without rebuilding the image
      - ./docker/extract.sh:/usr/local/bin/extract.sh:ro

  # Receives "everlake-client.sh check" reports from player machines on the LAN: docker compose --profile tools up -d report-drop
  report-drop:
    image: python:3.12-alpine
    profiles: ["tools"]
    restart: unless-stopped
    command: ["python", "/app/report-drop.py"]
    ports:
      - "8099:8099"
    volumes:
      - ./scripts/report-drop.py:/app/report-drop.py:ro
      - ./reports:/reports

  # The patched client build for players' test copies (docs/custom-files.md): our added files from CDN_DIR, everything
  # else passed through to Blizzard's CDN. Waits until cdn-build has written a build. Mac mini: everlake-client.sh cdn.
  cdn:
    image: python:3.12-alpine
    restart: unless-stopped
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    command: ["sh", "-c", "until [ -f /cdn/build.json ]; do sleep 30; done; exec python -I /app/tools/tact/cdn.py --dir /cdn --port 8087"]
    ports:
      - "${CDN_PORT:-8087}:8087"
    volumes:
      - ./tools/tact:/app/tools/tact:ro
      - ${CDN_DIR:-./cdn}:/cdn:ro

  # Writes the patched build the cdn service serves from the file sets in CDN_FILES_DIR:
  # docker compose run --rm cdn-build (scripts/cdn-build.sh)
  cdn-build:
    image: python:3.12-alpine
    profiles: ["tools"]
    command: ["sh", "/app/scripts/cdn-build.sh"]
    environment:
      HOST_UID: ${HOST_UID:-0}
      HOST_GID: ${HOST_GID:-0}
    volumes:
      - ./tools:/app/tools:ro
      - ./scripts/cdn-build.sh:/app/scripts/cdn-build.sh:ro
      - ${CDN_FILES_DIR:-./cdn-files}:/files:ro
      - ${CDN_DIR:-./cdn}:/cdn
      - cdn-cache:/cache

networks:
  everlake:

volumes:
  mysql-data:
  logs:
  casc-cache:
  cdn-cache:
